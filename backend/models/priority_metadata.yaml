trained_on: QC road crash data 2022-2025 (trained 2026-10-14)
priority_mapping_source: 'Derived from Classification: Fatal=High, Non Fatal Injury=Medium, Damage to Property=Low'
split: 80/20 stratified, random_state=42 (test set = 25,723 crashes, 92 High)
decision_rule: High if the model's High score >= high_cutoff, otherwise the larger of Medium/Low
cutoff_selection: 3-fold cross-validation on the training set; cutoff reaches the previous model's High recall
excluded_leakage_columns: [Drivers Killed, Drivers Injured, Pass. Killed, Pass Injured, Pedestrian Killed, Pedestrian Injured]
feature_columns:
- Hour
- Minute
- Day
- Month
- Weather
- Collision Type
- Accident Factor
- Bike
- E-Bike
- E-Trike
- E-Scooter
- Motorcycle
- Tricycle
- Car
- PUJ
- Fx / Taxi
- Bus
- Van
- Truck
- Train
- night
- late_night
- rush_hour
- weekday
- weekend
- total_vehicles
- two_wheelers
- motorcycle_involved
- heavy_involved
- single_vehicle
- moto_vs_heavy
- ct_pedestrian
- ct_head_on
- ct_self
- ct_hit_run
- ct_object
- ct_multiple
- ct_angle
- ct_rear
- ct_side
- ct_parked
- ct_unknown
- af_human
- af_liquor
- af_lost_control
- af_defect
- af_road
- af_none
models:
  random_forest:
    file: priority_random_forest.pkl
    summary: 'Random Forest (100 trees, depth 15, min leaf 5); gentler SMOTE (High raised to 10% of Low)'
    high_cutoff: 0.18429157026180643
    accuracy: 0.8435641254908058
    high_precision: 0.15849056603773584
    high_recall: 0.45652173913043476
    high_flagged: 265
