trained_on: QC road crash data 2022-2025 (trained 2026-10-17)
priority_mapping_source: 'Derived from Classification: Fatal=High, Non Fatal Injury=Medium, Damage to Property=Low'
split: train 2022-2023 (58445 crashes, 230 fatal); settings and cutoffs chosen on 2024 (34665 crashes, 125 fatal); test 2025 (35504 crashes, 106 fatal; 25960 on the 29 corridors, 71 fatal)
decision_rule: High if the model's High score >= high_cutoff, otherwise the larger of Medium/Low
model_selection: 6 settings per model, best High PR-AUC on 2024; cutoff maximises F2 on 2024
inputs: 85 (time, vehicles, engineered flags, one column per category value, street history)
excluded_leakage_columns: [Drivers Killed, Drivers Injured, Pass. Killed, Pass Injured, Pedestrian Killed, Pedestrian Injured]
